name: Model Validation and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      accuracy_threshold:
        description: "Minimum accuracy required for deployment"
        required: false
        default: "0.85"

jobs:
  validate:
    name: Validate Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow dvc scikit-learn

      - name: Configure MLflow tracking
        run: |
          echo "MLFLOW_TRACKING_URI=$GITHUB_WORKSPACE/mlruns" >> $GITHUB_ENV

      - name: Train model and save metrics
        run: |
          python train.py | tee train_output.log

          run_id=$(grep -Eo 'Run ID: [a-f0-9]{32}' train_output.log | awk '{print $3}' | tail -n 1)
          accuracy=$(grep -Eo 'Accuracy: [0-9.]+' train_output.log | awk '{print $2}' | tail -n 1)

          if [ -z "$run_id" ] || [ -z "$accuracy" ]; then
            echo "ERROR: Failed to extract run_id or accuracy"
            exit 1
          fi

          echo "$run_id" > model_info.txt
          echo "$accuracy" > accuracy.txt

          echo "Saved run_id=$run_id"
          echo "Saved accuracy=$accuracy"

      - name: Upload model info
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: model_info.txt

      - name: Upload accuracy
        uses: actions/upload-artifact@v4
        with:
          name: accuracy
          path: accuracy.txt

      - name: Upload MLflow data (optional)
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-data
          path: mlruns
          if-no-files-found: ignore

  deploy:
    name: Deploy Model
    runs-on: ubuntu-latest
    needs: validate

    env:
      ACCURACY_THRESHOLD: ${{ github.event.inputs.accuracy_threshold || '0.85' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Download model info
        uses: actions/download-artifact@v4
        with:
          name: model-info
          path: .

      - name: Download accuracy
        uses: actions/download-artifact@v4
        with:
          name: accuracy
          path: .

      - name: Check model threshold
        run: python check_threshold.py

      - name: Mock Build (Docker)
        run: |
          RUN_ID=$(cat model_info.txt)
          echo "Building Docker image for Run ID: $RUN_ID"