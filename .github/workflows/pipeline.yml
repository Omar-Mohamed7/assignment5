name: Model Validation and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      accuracy_threshold:
        description: "Minimum accuracy required for deployment"
        required: false
        default: "0.85"

jobs:
  validate:
    name: Validate Model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install mlflow dvc scikit-learn

      - name: Configure MLflow tracking URI
        run: |
          if [ -n "${{ secrets.MLFLOW_TRACKING_URI }}" ]; then
            echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> "$GITHUB_ENV"
            echo "Using MLflow tracking server from secret."
          else
            echo "MLFLOW_TRACKING_URI=file:./mlruns" >> "$GITHUB_ENV"
            echo "MLFLOW_TRACKING_URI secret not set. Using local file tracking."
          fi

      - name: Pull data with DVC
        run: |
          if ls ./*.dvc >/dev/null 2>&1 || [ -f dvc.yaml ]; then
            if dvc remote list | grep -q .; then
              dvc pull
            else
              echo "DVC metadata found, but no DVC remote configured. Skipping pull."
            fi
          else
            echo "No DVC metadata found in repository. Skipping pull."
          fi

      - name: Train model and export current MLflow Run ID
        run: |
          python train.py | tee train_output.log
          run_id=$(grep -Eo 'Run ID: [a-f0-9]{32}' train_output.log | awk '{print $3}' | tail -n 1)
          if [ -z "$run_id" ]; then
            echo "ERROR: Could not find Run ID in training output."
            exit 1
          fi
          echo "$run_id" > model_info.txt
          echo "Saved run_id=$run_id to model_info.txt"

      - name: Upload model info artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: model_info.txt

      - name: Upload local MLflow tracking data
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-data
          path: mlruns
          if-no-files-found: ignore

  deploy:
    name: Deploy Model
    runs-on: ubuntu-latest
    needs: validate
    env:
      ACCURACY_THRESHOLD: ${{ github.event.inputs.accuracy_threshold || '0.85' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install mlflow

      - name: Configure MLflow tracking URI
        run: |
          if [ -n "${{ secrets.MLFLOW_TRACKING_URI }}" ]; then
            echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> "$GITHUB_ENV"
            echo "Using MLflow tracking server from secret."
          else
            echo "MLFLOW_TRACKING_URI=file:./mlruns" >> "$GITHUB_ENV"
            echo "MLFLOW_TRACKING_URI secret not set. Using local file tracking."
          fi

      - name: Download model info artifact
        uses: actions/download-artifact@v4
        with:
          name: model-info
          path: .

      - name: Download local MLflow tracking data
        uses: actions/download-artifact@v4
        with:
          name: mlruns-data
          path: mlruns
        continue-on-error: true

      - name: Check model threshold
        run: python check_threshold.py

      - name: Mock Build
        run: |
          echo "Building Docker image for Run ID: $(cat model_info.txt)"
